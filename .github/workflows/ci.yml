name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libgl1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[test]
      - name: Run tests
        run: pytest -q
      - name: Coverage summary
        if: always()
        run: |
          python - <<'EOF'
          import json, sys
          # Simple placeholder; detailed coverage already printed by pytest-cov
          print('Tests completed.')
          EOF

  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: webui/frontend/package-lock.json
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libgl1
      - name: Install AutoForge (backend the e2e suite launches)
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Install frontend dependencies
        working-directory: webui/frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: webui/frontend
        run: npx playwright install --with-deps chromium
      - name: Run frontend unit tests
        working-directory: webui/frontend
        run: npm run test:unit
      - name: Run Playwright E2E tests
        working-directory: webui/frontend
        # Builds the frontend, then runs the full suite (including the
        # `jobs` project, which drives real — small, CPU-fast — optimization
        # runs) against a throwaway backend started by tests/test-server.mjs.
        run: npm test
        env:
          AUTOFORGE_PYTHON: python
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: webui/frontend/playwright-report/
          retention-days: 14

