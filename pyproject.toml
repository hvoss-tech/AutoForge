[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "AutoForge"
version="2.0.0"
description = "AutoForge - 3D color images made easy"
authors = [{ name = "Hendric Voss", email = "hvoss@techfak.uni-bielefeld.de" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC BY-NC-SA 4.0" }
dependencies = [
  "numpy",
  "torch>=2.9.1",
  "torchvision>=0.21.0",
  "transformers>=4.48.1",
  "opencv-python>=4.2.0.32",
  "matplotlib>=3.3.0",
  "configargparse>=1.2.3",
  "tqdm>=4.50.0",
  "pandas>=1.1.0",
  "scikit-image",
  "scikit-learn",
  "tensorboard",
  "pillow>=11.1.0",
  "shapely>=2.0.7",
  "trimesh>=4.6.4",
  "joblib>=1.4.2",
  "uvicorn[standard]>=0.44.0",
  "fastapi>=0.115.0",
  "python-multipart>=0.0.12",
  "aiofiles>=24.1.0",
  "websockets>=15.0",
  "pydantic-settings>=2.0.0",
  "posthog>=3.7.0",
]

[project.optional-dependencies]
# httpx isn't a runtime dependency of the app itself, but fastapi's
# TestClient needs it installed, and tests/webui/test_review_2026_09_23.py
# uses httpx.AsyncClient/ASGITransport directly to test concurrent requests.
test = [
  "pytest>=7.4",
  "pytest-cov",
  "hypothesis",
  "httpx>=0.27",
]

[tool.setuptools]
package-dir = {"" = "src"}

[project.scripts]
autoforge = "autoforge.auto_forge:main"

[tool.pytest.ini_options]
addopts = ""
pythonpath = ["src"]
